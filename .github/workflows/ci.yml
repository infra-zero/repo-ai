name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual CI runs. Releasing is release.yml's job, not this workflow's.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancelled: a cancelled run's test legs end `cancelled`, its `ci`
  # (always()) then fails, and that blocks the PR even when a second run on the
  # same SHA passed. A superseded run just finishes.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether the test matrix runs. A PR is docs-only when every changed
  # file is README.md or under apps/docs/; anything else (skills/, workflows/,
  # src/, tests/, .github/, root config) is code. push and workflow_dispatch
  # always count as code. An empty diff counts as code too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! grep -Evq '^(README\.md|apps/docs/.+)$' <<< "$files"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (>=22) and the newest Node.
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test --run
      # Mod tests import 'claude-code/testing', which only Claude Code's own runner
      # provides, so vitest never sees them. Pinned because the mod API is early
      # access, at the minimum Claude Code version the README states (#364).
      # Needs no login. release-guard is a safety mod (#366).
      - name: Test the mods
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
        run: |
          for mod in mods/*/; do
            npx --yes @anthropic-ai/claude-code@2.1.292 plugin test "$mod"
          done
      - run: pnpm run build
      - name: Build the dashboard app
        run: pnpm --filter @rtorcato/repo-ai-dashboard build
      # Run the package as npm would ship it, not as it sits in the repo: pack,
      # check the non-code files made it in, install the tarball somewhere
      # clean, and invoke the bin.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp"
          tarball="$(ls "$tmp"/*.tgz)"
          tar -tzf "$tarball" > "$tmp/files.txt"
          for f in skills/*/SKILL.md statusline/ai-loop.sh; do
            grep -qx "package/$f" "$tmp/files.txt" || { echo "::error::$f missing from tarball"; exit 1; }
          done
          cd "$tmp"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx --no-install repo-ai --version
          # doctor exits 1 on drift/missing — a bare dir has no .repo-ai.json (#159).
          # Exit 1 is accepted only for the failures this dir is expected to have:
          # no loop config, not a git repo, and on the runner no gh login and no
          # `claude` (#359). Anything else failing, a crash or non-JSON fails the step.
          out="$(npx --no-install repo-ai doctor --json)" || [ $? -eq 1 ]
          node -e '
            const { results } = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const expected = ["Loop config", "GitHub remote", "gh auth", "Claude Code"]
            const failing = results.filter((r) => r.status === "drift" || r.status === "missing").map((r) => r.check)
            const bad = [
              ...failing.filter((c) => !expected.includes(c)).map((c) => `unexpected failure: ${c}`),
              ...(failing.includes("Loop config") ? [] : ["Loop config was not reported missing"]),
              ...["Node", "git", "gh"].filter((c) => results.find((r) => r.check === c)?.status !== "ok").map((c) => `${c} is not ok`),
              ...results.filter((r) => r.status === "ok" && r.detail.startsWith("skipped — could not")).map((r) => `skip shown as ok: ${r.check}`),
            ]
            if (bad.length) { console.error(JSON.stringify(results, null, 2)); for (const b of bad) console.error(`::error::${b}`); process.exit(1) }
          ' <<< "$out"
      # What a stranger's first run hits (#366): an empty HOME, no terminal, and a
      # machine without gh. Same packed tarball, run by path so PATH can be cut down.
      - name: Smoke-test a clean environment
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp" > /dev/null
          (cd "$tmp" && npm init -y > /dev/null && npm install --no-audit --no-fund "$tmp"/*.tgz > /dev/null)
          cli="$tmp/node_modules/@rtorcato/repo-ai/dist/cli/index.js"
          fresh() { local d; d="$(mktemp -d)"; git -C "$d" init -q; echo "$d"; }

          echo "::group::setup --yes with an empty HOME and no terminal"
          # Every step must land on a fresh machine (#358, #367): no failed step, the
          # skills written into the empty HOME. Exit 1 is accepted only for what this
          # runner lacks: a gh login and a GitHub remote.
          home="$(mktemp -d)"
          out="$(cd "$(fresh)" && HOME="$home" node "$cli" setup --yes --json </dev/null)" || [ $? -eq 1 ]
          node -e '
            const fs = require("fs")
            const { steps, doctor } = JSON.parse(fs.readFileSync(0, "utf8"))
            const expected = ["gh auth", "GitHub remote"]
            const bad = [
              ...steps.filter((s) => s.status === "failed").map((s) => `setup step failed: ${s.target}: ${s.message}`),
              ...(fs.existsSync(`${process.argv[1]}/.claude/skills/ai-loop/SKILL.md`) ? [] : ["no ai-loop skill in the empty HOME"]),
              ...doctor.filter((r) => (r.status === "drift" || r.status === "missing") && !expected.includes(r.check)).map((r) => `unexpected failure: ${r.check}: ${r.detail}`),
            ]
            if (bad.length) { console.error(JSON.stringify({ steps, doctor }, null, 2)); for (const b of bad) console.error(`::error::${b}`); process.exit(1) }
          ' "$home" <<< "$out"
          echo "::endgroup::"

          echo "::group::setup with no terminal and no --yes"
          # Exits 1 with a hint instead of dying in inquirer with a stack trace (#358).
          code=0
          (cd "$(fresh)" && HOME="$(mktemp -d)" node "$cli" setup </dev/null) > "$tmp/out" 2> "$tmp/err" || code=$?
          cat "$tmp/err"
          [ "$code" -eq 1 ] || { echo "::error::setup without a terminal exited $code, not 1"; exit 1; }
          grep -q 're-run with --yes' "$tmp/err" || { echo "::error::no --yes hint"; exit 1; }
          if grep -Eq '^\s+at |Error:' "$tmp/err"; then echo "::error::setup printed a stack trace"; exit 1; fi
          echo "::endgroup::"

          echo "::group::doctor with no gh on PATH"
          # A missing gh is ✗ with an install hint, and every GitHub check says it did
          # not run: never a skip shown as ✓ (#359). PATH holds only node and git.
          bin="$(mktemp -d)"
          ln -s "$(command -v node)" "$bin/node"
          ln -s "$(command -v git)" "$bin/git"
          # The empty HOME is made first: PATH=$bin applies to expansions after it.
          home="$(mktemp -d)"
          out="$(cd "$(fresh)" && PATH="$bin" HOME="$home" "$bin/node" "$cli" doctor --json </dev/null)" || [ $? -eq 1 ]
          node -e '
            const { results } = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const by = (c) => results.find((r) => r.check === c)
            const github = ["AI loop labels", "Human user", "CI runs", "Release approval", "Release run", "Security alerts"]
            const bad = [
              ...(by("gh")?.status === "missing" && by("gh")?.hint?.includes("cli.github.com") ? [] : ["gh is not missing with an install hint"]),
              ...github.filter((c) => by(c)?.detail !== "not run because gh is unavailable").map((c) => `${c} did not say it was not run`),
              ...results.filter((r) => r.status === "ok" && r.detail.startsWith("skipped — could not")).map((r) => `skip shown as ok: ${r.check}`),
            ]
            if (bad.length) { console.error(JSON.stringify(results, null, 2)); for (const b of bad) console.error(`::error::${b}`); process.exit(1) }
          ' <<< "$out"
          echo "::endgroup::"

  # Both images build (#366). Its own job, beside the test matrix rather than in
  # it, so the image builds add no wall time to a PR.
  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [repo-ai, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          DOCKERFILE: ${{ matrix.image == 'dashboard' && 'docker/dashboard.Dockerfile' || 'docker/Dockerfile' }}
        run: docker build --file "$DOCKERFILE" .

  # The required status check. Branch protection names only `ci`, so this one
  # job stands for every matrix leg: it fails unless all of them succeeded,
  # including when one was cancelled — and skipped, unless the skip was earned.
  # Passes only when `changes` succeeded AND either it found a docs-only PR
  # (code == 'false') or both `test` and `docker` succeeded. A failed or
  # cancelled `changes`, or a cancelled/failed/skipped `test` or `docker` on a
  # code change, fails `ci`: a skipped required check counts as passing, so
  # the skip must never be a side effect of something going wrong.
  ci:
    needs: [changes, test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "changes=$CHANGES code=$CODE test=$TEST docker=$DOCKER"
          test "$CHANGES" = success && { test "$CODE" = false || { test "$TEST" = success && test "$DOCKER" = success; }; }
