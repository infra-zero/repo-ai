name: 📚 Docs
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  # The changelog page is built from GitHub Releases. The release job creates
  # them with GITHUB_TOKEN, and events from that token never start other
  # workflows, so `release: published` would never fire. Rebuild when CI —
  # whose last job is the release — finishes green on main instead.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://docs.infrazero.dev/repo-ai/
  cloudflare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@6824c7addbb827dc9539203a1166215051ee9658 # main as of 2026-09-30
    with:
      build-filter: '@infrazero/repo-ai-docs'
      worker-name: repo-ai-docs
      base-path: /repo-ai/
      route: docs.infrazero.dev/repo-ai/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
